name: Refresh per-zone NDVI/NDMI/LST

on:
  schedule:
    # Sunday 03:17 UTC — Sentinel-2 revisit cadence is 5 days, weekly is fine.
    - cron: "17 3 * * 0"
  workflow_dispatch: {}

concurrency:
  group: refresh-features
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
      GEE_SERVICE_ACCOUNT_KEY_PATH: ${{ runner.temp }}/gee-key.json
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      FEATURE_WINDOW_DAYS: "21"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Write GEE service-account key
        run: |
          printf '%s' "${{ secrets.GEE_SERVICE_ACCOUNT_KEY_JSON }}" > "$GEE_SERVICE_ACCOUNT_KEY_PATH"
          chmod 600 "$GEE_SERVICE_ACCOUNT_KEY_PATH"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Refresh per-zone features
        run: python ml/refresh_features.py

      - name: Clean key
        if: always()
        run: rm -f "$GEE_SERVICE_ACCOUNT_KEY_PATH"
